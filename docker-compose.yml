services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rankings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rankings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rankings"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rankings_pgdata:
